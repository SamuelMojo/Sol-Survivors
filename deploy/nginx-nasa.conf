# nginx site for nasa.samuelojo.tech  ->  the Node game server on 127.0.0.1:3000
# (certbot adds the HTTPS parts for you; see AWS_DEPLOY.md step 6)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name nasa.samuelojo.tech;

    # Game files are small; compress text
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket upgrade (Socket.IO needs this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle game connections open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
